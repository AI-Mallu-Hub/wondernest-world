opacity="0.18"
stroke-linecap="round"

d="
M500 825
C470 855 435 885 395 920

M700 825
C730 855 765 885 805 920
"/>
        <!-- Root Geometry -->

<path .../>

<!-- Highlight -->

<path .../>

<!-- Shadow -->

<path .../>

        <!-- Session 1 LOCKED -->
    </g>

    <!-- ===================================================== -->
    <!-- TRUNK -->
    <!-- ===================================================== -->

    <g id="trunk-body"></g>

    <!-- ===================================================== -->
    <!-- MAIN BRANCHES -->
    <!-- ===================================================== -->

    <g id="main-branches"></g>

    <!-- ===================================================== -->
    <!-- SECONDARY BRANCHES -->
    <!-- ===================================================== -->

    <g id="secondary-branches"></g>

    <!-- ===================================================== -->
