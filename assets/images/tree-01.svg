<!-- Root Base Highlight -->
<!-- Session 1 Part C -->
<!-- ===================================================== -->

<path
fill="none"
stroke="#A77A56"
stroke-width="5"
stroke-linecap="round"
stroke-linejoin="round"
opacity="0.30"

d="
M585 775
C560 785 540 805 525 825

M610 775
C635 785 655 805 675 825

M565 845
C550 875 548 915 548 955

M635 845
C650 875 652 915 652 955
"/>

<!-- ===================================================== -->
