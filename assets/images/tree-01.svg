<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="1200"
    viewBox="0 0 1200 1200">

    <title>WonderNest - WN-TREE-001</title>
    <desc>Mother Tree Production Asset</desc>

    <!-- ===================================================== -->
    <!-- DEFINITIONS -->
    <!-- ===================================================== -->

    <defs>

        <!-- Base Bark Gradient -->
        <linearGradient id="barkGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">

            <stop offset="0%" stop-color="#7B5B3E"/>

            <stop offset="100%" stop-color="#5B3E29"/>

        </linearGradient>
      <!-- ===================================================== -->
<!-- ROOT BASE STYLES -->
<!-- Session 1 • Part C -->
<!-- ===================================================== -->

<linearGradient id="rootBaseGradient"
                x1="0%"
                y1="0%"
                x2="0%"
                y2="100%">

    <stop offset="0%" stop-color="#8B6545"/>
    <stop offset="100%" stop-color="#5E402B"/>

</linearGradient>

<filter id="softShadow"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%">

    <feGaussianBlur stdDeviation="3"/>

</filter>

    </defs>

    <!-- ===================================================== -->
    <!-- ROOT BASE -->
    <!-- ===================================================== -->

    <g id="root-base"
   fill="url(#rootBaseGradient)"
   stroke="#4B3425"
   stroke-width="2"
   stroke-linejoin="round"
   stroke-linecap="round"
   vector-effect="non-scaling-stroke">

    <!-- Root paths -->



        <!-- ===================================================== -->
<!-- ROOT BASE -->
<!-- Session 1 • Part B -->
<!-- ===================================================== -->

d="
M600 760

C560 760 525 780 500 815

C470 855 430 875 355 905

C430 890 485 860 525 825

C490 855 455 890 420 930

C485 915 535 890 570 845

C560 885 560 930 555 980

C585 940 605 900 610 845

C625 890 655 940 690 980

C690 930 690 885 680 845

C720 890 770 915 835 930

C800 890 765 855 730 825

C770 860 825 890 900 905

C820 875 775 855 745 815

C720 780 680 760 640 760

Z"/>

