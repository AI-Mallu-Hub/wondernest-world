<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="1200"
    viewBox="0 0 1200 1200">

    <title>WonderNest - WN-TREE-001</title>
    <desc>Mother Tree Production Asset</desc>

    <!-- ===================================================== -->
    <!-- DEFINITIONS -->
    <!-- ===================================================== -->

    <defs>

        <!-- Base Bark Gradient -->
        <linearGradient id="barkGradient"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">

            <stop offset="0%" stop-color="#7B5B3E"/>

            <stop offset="100%" stop-color="#5B3E29"/>

        </linearGradient>
      <!-- ===================================================== -->
<!-- ROOT BASE STYLES -->
<!-- Session 1 • Part C -->
<!-- ===================================================== -->

<linearGradient id="rootBaseGradient"
                x1="0%"
                y1="0%"
                x2="0%"
                y2="100%">

    <stop offset="0%" stop-color="#8B6545"/>
    <stop offset="100%" stop-color="#5E402B"/>

</linearGradient>

<filter id="softShadow"
        x="-20%"
        y="-20%"
        width="140%"
        height="140%">

    <feGaussianBlur stdDeviation="3"/>

</filter>

    </defs>

    <!-- ===================================================== -->
    <!-- ROOT BASE -->
    <!-- ===================================================== -->

    <g id="root-base"
   fill="url(#rootBaseGradient)"
   stroke="#4B3425"
   stroke-width="2"
   stroke-linejoin="round"
   stroke-linecap="round"
   vector-effect="non-scaling-stroke">

    <!-- Root paths -->



        <!-- ===================================================== -->
<!-- ROOT BASE -->
<!-- Session 1 • Part B -->
<!-- ===================================================== -->

<path d="M540,790 C480,800 420,822 360,852 L378,860 C440,832 500,810 555,798 Z"/>

<path d="M555,802 C500,818 450,838 410,862 L430,868 C465,844 512,822 564,810 Z"/>

<path d="M570,812 C545,832 520,852 505,872 L522,876 C540,857 560,836 580,818 Z"/>

<path d="M600,812 C625,832 650,852 665,872 L648,876 C630,857 612,836 592,818 Z"/>

<path d="M615,802 C670,818 720,838 760,862 L740,868 C705,844 660,822 606,810 Z"/>

<path d="M630,790 C690,800 750,822 810,852 L792,860 C730,832 670,810 615,798 Z"/>

    </g>

    <!-- ===================================================== -->
    <!-- TRUNK -->
    <!-- ===================================================== -->

    <g id="trunk-body"></g>

    <!-- ===================================================== -->
    <!-- MAIN BRANCHES -->
    <!-- ===================================================== -->

    <g id="main-branches"></g>

    <!-- ===================================================== -->
    <!-- SECONDARY BRANCHES -->
    <!-- ===================================================== -->

    <g id="secondary-branches"></g>

    <!-- ===================================================== -->
    <!-- CANOPY -->
    <!-- ===================================================== -->

    <g id="canopy-back"></g>

    <g id="canopy-middle"></g>

    <g id="canopy-front"></g>

    <!-- ===================================================== -->
    <!-- DETAILS -->
    <!-- ===================================================== -->

    <g id="lighting"></g>

    <g id="shadows"></g>

</svg>
